name: build

# Desktop application for Windows, macOS and Linux.
# A tag v1.2.3 publishes a release of that version:
# .dmg on macOS, .AppImage and .tar.gz on Linux, .zip on Windows, each with a .sha256.
# Copies without the version are attached so the README can link to releases/latest.
# The terminal command is not attached: install it with go install.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            number="${GITHUB_REF_NAME#v}"
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
              echo "release tag must be a version, for example v1.2.3" >&2
              exit 1
            fi
          else
            number="dev"
          fi
          # Windows and macOS bundle metadata need a dotted number.
          bundle="${number%%[-+]*}"
          if [[ "$bundle" == "dev" ]]; then
            bundle="0.0.0"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          sed -i.bak "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${bundle}\"/" wails.json
          rm -f wails.json.bak
      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          args=(build -clean -ldflags "-X main.version=${{ steps.version.outputs.number }}" -platform "${{ matrix.goos }}/${{ matrix.goarch }}")
          if [[ "${{ matrix.goos }}" == "linux" ]]; then
            args+=(-tags webkit2_41)
          fi
          wails "${args[@]}"
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.number }}"
          name="lman-${ver}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          case "${{ matrix.goos }}" in
            darwin)
              test -d build/bin/Lman.app
              ditto -c -k --keepParent build/bin/Lman.app "dist/${name}.zip"
              stage="$(mktemp -d)"
              ditto build/bin/Lman.app "${stage}/Lman.app"
              ln -s /Applications "${stage}/Applications"
              hdiutil create -volname Lman -srcfolder "${stage}" -ov -format UDZO "dist/${name}.dmg"
              rm -rf "${stage}"
              ;;
            windows)
              test -f build/bin/lman-desktop.exe
              tar -a -cf "dist/${name}.zip" -C build/bin lman-desktop.exe
              ;;
            linux)
              test -f build/bin/lman-desktop
              tar -C build/bin -czf "dist/${name}.tar.gz" lman-desktop
              sh build/linux/appimage.sh build/bin/lman-desktop build/appicon.png "dist/${name}.AppImage"
              ;;
          esac
          checksum() {
            local f="$1" hash
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$f" | awk '{print $1}')"
            else
              hash="$(shasum -a 256 "$f" | awk '{print $1}')"
            fi
            printf '%s  %s\n' "$hash" "$(basename "$f")" > "${f}.sha256"
          }
          for f in dist/*; do
            case "$f" in *.sha256) continue ;; esac
            [ -f "$f" ] || continue
            checksum "$f"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: lman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Names without the version, for releases/latest/download
        shell: bash
        run: |
          set -euo pipefail
          cd out
          ver="${GITHUB_REF_NAME#v}"
          for f in lman-*; do
            case "$f" in *.sha256) continue ;; esac
            dest="${f/lman-${ver}-/lman-}"
            if [[ "$dest" == "$f" ]]; then
              echo "unexpected release file: $f" >&2
              exit 1
            fi
            cp -a "$f" "$dest"
            hash="$(awk '{print $1; exit}' "${f}.sha256")"
            printf '%s  %s\n' "$hash" "$dest" > "${dest}.sha256"
          done
          ls -l
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
