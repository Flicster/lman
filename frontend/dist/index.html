<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lman</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">L</span>
        <span>Lman</span>
      </div>
      <div class="host">
        <button class="pill" id="host-button" type="button">
          <span class="dot" id="host-dot"></span>
          <span id="host-name">local</span>
          <svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <div class="popover" id="host-popover" hidden>
          <button class="item" type="button" data-local="1">
            <span class="choice"><span class="dot"></span>local</span>
            <span class="check" id="local-check">✓</span>
          </button>
          <div id="host-servers"></div>
          <form class="connect" id="connect-form">
            <input id="connect-input" placeholder="user@server or ssh alias" autocomplete="off" spellcheck="false" />
            <button class="btn" type="submit">Connect</button>
          </form>
          <p class="hint">Uses your ssh keys and ~/.ssh/config.</p>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="refresh" type="button" title="Scan again">
        <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" /></svg>
      </button>
      <div class="segmented" id="theme" role="group" aria-label="Theme">
        <button type="button" data-theme="light" title="Light">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
        <button type="button" data-theme="dark" title="Dark">
          <svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" /></svg>
        </button>
        <button type="button" data-theme="system" title="System">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
        </button>
      </div>
      <div class="clock" id="clock"></div>
    </header>

    <main id="view"></main>

    <footer class="statusbar" id="statusbar"></footer>

    <div class="modal" id="modal" hidden>
      <div class="card dialog">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <div class="row end">
          <button class="btn ghost" id="modal-cancel" type="button">Cancel</button>
          <button class="btn danger" id="modal-ok" type="button">Remove</button>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="/app.js"></script>
  </body>
</html>
